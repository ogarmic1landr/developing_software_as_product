[project]
name = "vehicle-segmentation"
version = "0.1.0"
description = "Vehicle segmentation pipeline refactored from notebook to product"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebook.ipynb" = ["E402", "F401", "F821", "UP038"]
"*.ipynb" = ["E402", "F401", "F821", "UP038"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 100
target-version = ["py310"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
